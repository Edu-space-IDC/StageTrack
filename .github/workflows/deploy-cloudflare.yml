name: Deploy StageTracks community API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'apps-script/Code.gs'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure KV namespace
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          config = Path('cloudflare/wrangler.toml')
          text = config.read_text(encoding='utf-8-sig')
          namespace_id = os.environ['KV_NAMESPACE_ID'].strip()
          if not namespace_id:
              raise SystemExit('Configure CLOUDFLARE_KV_NAMESPACE_ID in repository secrets.')
          config.write_text(text.replace('REPLACE_WITH_KV_NAMESPACE_ID', namespace_id), encoding='utf-8')
          PY
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml
          secrets: |
            APPS_SCRIPT_URL
            API_TOKEN
            COMMUNITY_ADMIN_TOKEN
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          COMMUNITY_ADMIN_TOKEN: ${{ secrets.COMMUNITY_ADMIN_TOKEN }}
