name: Deploy StageTracks community API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'apps-script/Code.gs'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker and report actionable errors
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN'; exit 1; fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then echo '::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID'; exit 1; fi
          log_file="$RUNNER_TEMP/wrangler-deploy.log"
          if ! npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml 2>&1 | tee "$log_file"; then
            detail="$(tail -n 16 "$log_file" | tr '\n' ' ' | sed 's/%/%25/g; s/::/%3A%3A/g; s/:/%3A/g')"
            echo "::error title=Cloudflare Worker deployment failed::$detail"
            exit 1
          fi
