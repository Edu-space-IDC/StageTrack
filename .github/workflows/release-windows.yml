name: Build and publish Windows release

on:
  push:
    tags:
      - 'v0.5.30'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WebView2 SDK required by JUCE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.3485.44'
          $packagesRoot = Join-Path $env:USERPROFILE 'AppData/Local/PackageManagement/NuGet/Packages'
          $packageRoot = Join-Path $packagesRoot "Microsoft.Web.WebView2.$version"
          $header = Join-Path $packageRoot 'build/native/include/WebView2.h'
          if (-not (Test-Path -LiteralPath $header)) {
            $packageFile = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$version.nupkg"
            $extractRoot = Join-Path $env:RUNNER_TEMP 'webview2-sdk-extract'
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $packageFile
            if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extractRoot, $packageRoot | Out-Null
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($packageFile, $extractRoot)
            Get-ChildItem -LiteralPath $extractRoot | Copy-Item -Destination $packageRoot -Recurse -Force
          }
          if (-not (Test-Path -LiteralPath $header)) { throw "WebView2 SDK $version was not installed correctly." }

      - name: Restore bundled pad audio from previous release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP 'stagetracks-previous-portable.zip'
          Invoke-WebRequest -Uri 'https://github.com/Edu-space-IDC/StageTrack/releases/download/v0.5.2/StageTracks-portable-windows-x64.zip' -OutFile $archivePath
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          $root = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $hasDefaultPads = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/').StartsWith('Pads/Default/', [System.StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 1
          try {
            foreach ($entry in $archive.Entries) {
              $normalizedPath = $entry.FullName.Replace('\', '/')
              if (-not $normalizedPath.StartsWith('Pads/', [System.StringComparison]::OrdinalIgnoreCase)) { continue }
              $relative = $normalizedPath.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              $destination = [System.IO.Path]::GetFullPath((Join-Path $root $relative))
              if (-not $destination.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Invalid archive path: $relative" }
              if ($normalizedPath.EndsWith('/')) { [System.IO.Directory]::CreateDirectory($destination) | Out-Null; continue }
              [System.IO.Directory]::CreateDirectory([System.IO.Path]::GetDirectoryName($destination)) | Out-Null
              $source = $entry.Open()
              $target = [System.IO.File]::Create($destination)
              try { $source.CopyTo($target) } finally { $target.Dispose(); $source.Dispose() }
            }
          } finally { $archive.Dispose() }
          if (-not $hasDefaultPads -or -not (Test-Path (Join-Path $root 'Pads/Default'))) { throw 'Pad audio was not restored from the previous release.' }

      - name: Install web dependencies
        run: npm ci

      - name: Build StageTracks, Reaper Control Studio, and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./packaging/windows/build-release.ps1
          } catch {
            $message = $_.Exception.Message
            $stack = $_.ScriptStackTrace
            $details = if ($stack) { "$message`n$stack" } else { $message }
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
            Write-Output "::error title=Windows release build failed::$annotation"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows release build failed`n`n````text`n$details`n````"
            throw
          }

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME `
            'release-artifacts/StageTracks-Setup-windows-x64.exe' `
            'release-artifacts/StageTracks-portable-windows-x64.zip' `
            'release-artifacts/Reaper Control Studio.exe' `
            'public/downloads/Reaper-Control-Studio-Reaper-files.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --title 'StageTracks 0.5.30' `
            --notes 'Refreshes the installer, aligns the Windows title bar with the app, smooths timeline playback, adds drag-and-drop import/open, and prevents deleted community projects from returning after restart.'
